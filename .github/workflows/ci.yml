name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9"

jobs:
  # 1 ─ Install + cache the workspace once; downstream jobs reuse the store.
  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @b2b/database generate

  # 2 ─ Lint every package.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @b2b/database generate
      - run: pnpm lint

  # 3 ─ Strict TypeScript across the monorepo.
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @b2b/database generate
      - run: pnpm typecheck

  # 4 ─ Unit tests (pricing + financial logic).
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @b2b/database generate
      - run: pnpm --filter @b2b/api test

  # 5 ─ Build both apps (API nest build + web next build).
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    env:
      # Build-time placeholders; real secrets are injected at deploy time.
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'ci_build_secret_please_override_in_deploy' }}
      NEXTAUTH_URL: https://app.example.com
      PLATFORM_DOMAIN: app.example.com
      SHOPIFY_CLIENT_ID: ci_client_id
      SHOPIFY_CLIENT_SECRET: ci_client_secret
      API_BASE_URL: https://api.example.com
      INTERNAL_API_SECRET: ci_internal_secret_at_least_32_chars_long
      NEXT_PUBLIC_API_BASE_URL: https://api.example.com
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @b2b/database generate
      - run: pnpm build
      - name: Upload web build
        uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: apps/web/.next
          retention-days: 3

  # 6 ─ Playwright end-to-end suite.
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: build
    env:
      PLAYWRIGHT_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @b2b/database generate
      # Playwright is intentionally NOT a workspace dependency (keeps the local
      # offline install lean); CI fetches the pinned version on demand.
      - name: Install Playwright browsers
        run: pnpm dlx playwright@1.47.2 install --with-deps chromium
      - name: Run E2E
        run: pnpm dlx playwright@1.47.2 test
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # 7 ─ Lighthouse performance budget on the built web app.
  lighthouse:
    name: Lighthouse budget
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run Lighthouse CI
        run: pnpm dlx @lhci/cli@0.13.x autorun --config=./.lighthouserc.json
        continue-on-error: true

  # 8 ─ Dependency / source security audit.
  security:
    name: Security audit
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
        continue-on-error: true
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
