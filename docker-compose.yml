# Local development infrastructure.
#
# The PostgreSQL database is hosted by Supabase (local: `npx supabase start`,
# which provides PgBouncer + the DB on port 54322) — it is intentionally NOT a
# docker-compose service here. Only the two Redis instances run via compose.
# Production runs Redis as a managed service (Railway Redis).
services:
  redis-cache:
    image: redis:7-alpine
    container_name: b2b-redis-cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - b2b-network

  redis-queue:
    image: redis:7-alpine
    container_name: b2b-redis-queue
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: >
      redis-server
      --maxmemory-policy noeviction
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redisqueuedata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - b2b-network

volumes:
  redisqueuedata:

networks:
  b2b-network:
    driver: bridge
